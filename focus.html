<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self' https: http:; style-src 'self'; script-src 'self'; img-src 'self' data: https: http:; frame-src https: http:">
  <title>專注進行中</title>
  <link rel="stylesheet" href="focus.css">
</head>
<body>
  <div class="focus-shell">
    <header>
      <div class="focus-title">
        <span class="pulse"></span>
        <div>
          <small id="mode-label">專注進行中</small>
          <strong id="session-title">讀書</strong>
        </div>
      </div>
      <div class="timer">
        <small>剩餘時間</small>
        <strong id="countdown">--:--</strong>
      </div>
      <button id="emergency-button" type="button">
        <span id="exit-hint">長按 5 秒緊急解鎖</span>
        <i id="hold-progress"></i>
      </button>
    </header>

    <main id="focus-content">
      <section id="lock-screen" class="lock-screen" hidden>
        <div class="quote-mark">“</div>
        <p>現在的專心，<br>會成為未來的底氣。</p>
        <span>暫時放下其他事情，完成這一段時間。</span>
        <div class="tomato">番</div>
      </section>
      <section id="web-area" class="web-area" hidden>
        <webview id="focus-webview" partition="focus-web" preload="./focus-web-preload.js"></webview>
      </section>
      <section id="load-error" class="load-error" hidden>
        <div class="tomato">!</div>
        <h2>專注網頁無法載入</h2>
        <p id="load-error-message">請檢查網路或網址。倒數仍會繼續，時間到會自動解除。</p>
      </section>
    </main>
  </div>

  <aside id="focus-notice" class="focus-notice" hidden>
    <span id="focus-notice-message"></span>
    <button id="close-notice" type="button" aria-label="關閉提示">×</button>
  </aside>

  <aside id="rest-reminder" class="rest-toast" hidden>
    <div class="rest-card">
      <span>休息提醒</span>
      <strong>你已經專注一小時了</strong>
      <p>喝口水、看看遠方，活動一下肩頸，再繼續努力。</p>
      <button id="continue-button" type="button">關閉提醒</button>
    </div>
  </aside>

  <div id="unlock-confirm" class="modal-backdrop" hidden>
    <div class="unlock-card">
      <span>緊急解鎖</span>
      <h2>確定要提前結束嗎？</h2>
      <p>正式專注還沒結束。只有遇到緊急狀況時才建議退出。</p>
      <div>
        <button id="cancel-unlock" type="button">繼續專注</button>
        <button id="confirm-unlock" class="danger-button" type="button">確定解鎖</button>
      </div>
    </div>
  </div>

  <script src="focus.js"></script>
</body>
</html>
